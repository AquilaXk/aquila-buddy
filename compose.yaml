services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aquila-buddy-postgres
    environment:
      POSTGRES_DB: aquila_buddy
      POSTGRES_USER: aquila
      POSTGRES_PASSWORD: aquila
    ports:
      - "5432:5432"
    volumes:
      - aquila-buddy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquila -d aquila_buddy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aquila-buddy-postgres:
