changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
      - chore
      - ci
      - skip-changelog
  categories:
    - title: "✨ 주요 기능 (Features)"
      labels:
        - feat
        - feature
        - enhancement
    - title: "🐛 결함 수정 (Bug Fixes)"
      labels:
        - fix
        - bug
    - title: "🔒 보안 및 안정성 (Security & Hardening)"
      labels:
        - security
    - title: "📦 빌드 및 릴리스 (Build & Release)"
      labels:
        - build
        - release
    - title: "🔧 기타 개선 (Other Changes)"
      labels:
        - "*"
