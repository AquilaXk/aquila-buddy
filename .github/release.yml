changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: "🚀 주요 기능 (Features)"
      labels:
        - feat
        - feature
        - enhancement
    - title: "🐛 버그 및 회귀 수정 (Fixes)"
      labels:
        - fix
        - bug
    - title: "⚡ 성능 최적화 (Performance)"
      labels:
        - perf
        - performance
    - title: "🧱 아키텍처 및 리팩토링 (Refactoring)"
      labels:
        - refactor
    - title: "📚 문서 및 거버넌스 (Documentation)"
      labels:
        - docs
        - documentation
    - title: "🔧 CI/CD 및 유지보수 (Chores & Infra)"
      labels:
        - ci
        - chore
        - build
        - test
        - task
    - title: "기타 변경 사항 (Other Changes)"
      labels:
        - "*"
