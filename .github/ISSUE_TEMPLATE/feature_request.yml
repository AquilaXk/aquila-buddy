name: "Feature"
description: "신규 기능이나 사용자 가치가 커지는 개선 작업을 정리합니다."
labels: ["feature"]
body:
  - type: input
    id: goal
    attributes:
      label: Goal
      description: 이 작업으로 어떤 결과를 만들고 싶은지 한 문장으로 적어 주세요.
      placeholder: 예) GitHub 프로필 분석 결과를 대시보드에 표시한다.
    validations:
      required: true

  - type: input
    id: domain
    attributes:
      label: Domain
      description: 관련 도메인, 화면, API 경로를 적어 주세요.
      placeholder: 예) back/user, front/dashboard, api/v1/issues
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: Background
      description: 왜 필요한지, 지금 어떤 불편이나 기회가 있는지 설명해 주세요.
      placeholder: 예) 추천 전에 사용자 기술 스택을 확인할 방법이 필요합니다.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: 완료로 볼 기준을 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] 핵심 사용자 흐름이 기대한 방식으로 동작하는지 확인했는가?
        - [ ] API/화면 계약이 문서와 일치하는가?
        - [ ] 테스트와 검증을 수행했는가?
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out Of Scope
      description: 이번 작업에서 의도적으로 제외할 범위를 설명해 주세요.
      placeholder: 예) Chrome extension 연동은 이번 범위에서 제외

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 권한, 캐시, 운영 리스크처럼 미리 공유해야 할 점을 적어 주세요.
      placeholder: 예) GitHub API rate limit 영향을 확인해야 함

  - type: textarea
    id: todo
    attributes:
      label: Todo
      description: 구현 순서를 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] 요구사항과 제외 범위를 정리했는가?
        - [ ] API/화면 설계를 확정했는가?
        - [ ] 구현 후 필요한 검증을 마쳤는가?
        - [ ] 문서와 운영 영향까지 반영했는가?
    validations:
      required: true
