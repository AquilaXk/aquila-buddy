name: "성능"
description: "렌더링, 번들, 대량 조회, 병목처럼 성능 개선이 필요한 작업을 정리합니다."
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        제목은 `[Perf] 한국어 작업 요약` 형식으로 작성합니다.
        본문은 한국어 중심으로 작성하고 API, OAuth, SQL, CI처럼 현업 공통 용어만 영어를 유지합니다.

  - type: input
    id: parent_epic
    attributes:
      label: 상위 에픽 (Parent Epic)
      description: 이 작업이 속한 상위 에픽 이슈 번호를 적어 주세요.
      placeholder: "#이슈번호 (단독 버그나 에픽 직결이 아닌 경우 생략)"

  - type: input
    id: target
    attributes:
      label: 대상
      description: 어느 페이지, API, 렌더 경로를 개선하려는지 적어 주세요.
      placeholder: 예) GET /api/v1/issues/recommend, front build bundle
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 시나리오
      description: 어떤 트래픽, 데이터 규모, 사용 시나리오에서 문제가 드러나는지 설명해 주세요.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 현재 지표
      description: 현재 확인한 성능 지표나 체감 문제를 적어 주세요.
      placeholder: 예) p95 3.1s, JS 420KB, GitHub API 호출 과다
    validations:
      required: true

  - type: textarea
    id: target_metric
    attributes:
      label: 목표 지표
      description: 개선 후 어느 수준까지 맞추고 싶은지 적어 주세요.
    validations:
      required: true

  - type: textarea
    id: hypothesis
    attributes:
      label: 병목 / 가설
      description: 병목 원인 추정이나 먼저 확인해야 할 포인트를 설명해 주세요.

  - type: textarea
    id: validation
    attributes:
      label: 검증 계획
      description: 개선 후 어떤 방식으로 확인할지 적어 주세요.
      placeholder: |
        - [ ] 같은 시나리오에서 다시 계측했는가?
        - [ ] 이전 지표와 개선 후 지표를 비교했는가?
        - [ ] 운영 영향과 롤백 기준을 정리했는가?
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: 작업 목록
      description: 작업 순서를 체크리스트로 적어 주세요.
      placeholder: |
        - [ ] 병목을 같은 조건에서 재현했는가?
        - [ ] 계측/프로파일링으로 원인을 좁혔는가?
        - [ ] 개선 후 성능을 다시 측정했는가?
        - [ ] 롤백 기준과 운영 영향까지 정리했는가?
    validations:
      required: true
