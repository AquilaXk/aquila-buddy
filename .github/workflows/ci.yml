name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend checks
        run: ./gradlew check --no-daemon

  pgvector-integration:
    name: Pgvector Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: aquila_buddy
          POSTGRES_USER: aquila
          POSTGRES_PASSWORD: aquila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aquila -d aquila_buddy"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run pgvector integration test
        env:
          PGVECTOR_TEST_DB_URL: jdbc:postgresql://localhost:5432/aquila_buddy
          PGVECTOR_TEST_DB_USER: aquila
          PGVECTOR_TEST_DB_PASSWORD: aquila
        run: bash tools/test/run-pgvector-integration.sh

  operations-smoke:
    name: Operations Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate openai-compatible pgvector smoke env
        env:
          AI_PROVIDER: openai-compatible
          AI_API_BASE_URL: https://api.openai.com/v1
          AI_API_KEY: test-key
          AI_CHAT_MODEL: gpt-4o-mini
          AI_TEMPERATURE: "0.2"
          AI_EMBEDDING_MODEL: text-embedding-3-small
          AI_EMBEDDING_DIMENSIONS: "1536"
          GITHUB_TOKEN: github-token
          GITHUB_TOKEN_PERMISSIONS: metadata:read,contents:read,pull-requests:read,issues:read
          RECOMMENDATION_SIMILARITY_PROVIDER: pgvector
          RECOMMENDATION_SIMILARITY_LIMIT: "20"
          DB_URL: jdbc:postgresql://localhost:5432/aquila_buddy
          DB_USER: aquila
          DB_PASSWORD: aquila
        run: bash tools/smoke/validate-ai-runtime-env.sh

      - name: Validate release readiness records
        run: bash tools/smoke/validate-release-readiness-record.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:18080
        run: npm run build

      - name: Run frontend integration smoke contracts
        run: node --test ../tools/frontend/integration-smoke/*.test.mjs

      - name: Run frontend integration smoke
        env:
          FRONTEND_INTEGRATION_SERVER_MODE: start
          FRONTEND_INTEGRATION_FIXTURE_BACKEND_PORT: "18080"
          FRONTEND_INTEGRATION_SMOKE_TIMEOUT_MS: "90000"
          FRONTEND_INTEGRATION_ROUTE_TIMEOUT_MS: "20000"
          NEXT_PUBLIC_API_URL: http://127.0.0.1:18080
          EXTENSION_E2E_CHROME_STARTUP_TIMEOUT_MS: "30000"
          EXTENSION_E2E_CHROME_EXTRA_FLAGS: "--enable-logging=stderr --v=1"
        run: npm run smoke:integration

  extension:
    name: Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run extension validation
        run: npm --prefix extension run validate

      - name: Run extension live E2E
        env:
          EXTENSION_E2E_CHROME_STARTUP_TIMEOUT_MS: "30000"
          EXTENSION_E2E_CHROME_EXTRA_FLAGS: "--enable-logging=stderr --v=1"
        run: npm --prefix extension run test:e2e
