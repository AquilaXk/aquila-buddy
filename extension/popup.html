<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 340px;
      background: #ffffff;
      color: #121317;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    .hidden {
      display: none !important;
    }

    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid rgba(33, 34, 38, 0.10);
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #121317;
    }

    .brand-mark {
      display: inline-block;
      width: 14px;
      height: 14px;
      color: #121317;
      flex-shrink: 0;
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.on {
      background: #137333;
      box-shadow: 0 0 0 2px #e6f4ea;
    }

    .dot.off {
      background: #6a6a71;
    }

    #status-label {
      font-size: 12px;
      color: #45474d;
    }

    .btn-primary,
    #login-btn {
      padding: 5px 12px;
      background: #121317;
      color: #ffffff;
      border: 1px solid #121317;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-primary:hover,
    #login-btn:hover {
      background: #2f3034;
      border-color: #2f3034;
    }

    .btn-secondary,
    #logout-btn {
      padding: 5px 12px;
      background: #f8f9fc;
      color: #121317;
      border: 1px solid rgba(33, 34, 38, 0.12);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary:hover,
    #logout-btn:hover {
      background: #eff2f7;
      border-color: rgba(33, 34, 38, 0.18);
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #1a73e8;
      outline-offset: 2px;
    }

    #rec-section {
      padding: 12px 16px 16px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: #6a6a71;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .section-hint {
      font-size: 11px;
      font-weight: 500;
      color: #6a6a71;
      font-variant-numeric: tabular-nums;
    }

    #rec-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 460px;
      overflow-y: auto;
    }

    .rec-card {
      display: block;
      padding: 10px 12px;
      background: #f8f9fc;
      border: 1px solid rgba(33, 34, 38, 0.10);
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }

    .rec-card:hover {
      background: #eff2f7;
      border-color: rgba(33, 34, 38, 0.18);
    }

    .rec-card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .rec-repo {
      font-size: 11px;
      font-weight: 500;
      color: #6a6a71;
      font-variant-numeric: tabular-nums;
    }

    .rec-title {
      margin-bottom: 4px;
      color: #121317;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.4;
    }

    .rec-summary {
      display: -webkit-box;
      margin: 2px 0 6px;
      overflow: hidden;
      color: #45474d;
      font-size: 12px;
      line-height: 1.5;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .rec-labels {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .rec-label {
      display: inline-block;
      padding: 1px 6px;
      background: #eff2f7;
      border: 1px solid rgba(33, 34, 38, 0.08);
      border-radius: 4px;
      color: #45474d;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .rec-analyzed {
      margin-left: auto;
      padding: 1px 6px;
      background: #e6f4ea;
      border: 1px solid rgba(19, 115, 51, 0.20);
      border-radius: 4px;
      color: #137333;
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .empty-state {
      text-align: center;
      padding: 20px 12px;
      background: #f8f9fc;
      border: 1px solid rgba(33, 34, 38, 0.06);
      border-radius: 8px;
      color: #6a6a71;
      font-size: 12px;
      line-height: 1.6;
    }

    #refresh-btn {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 8px 12px;
      background: #121317;
      color: #ffffff;
      border: 1px solid #121317;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    #refresh-btn:hover {
      background: #2f3034;
      border-color: #2f3034;
    }

    #rec-loading {
      color: #6a6a71;
      font-size: 12px;
      padding: 12px 0;
    }
  </style>
</head>
<body>
  <div id="status-bar">
    <div class="status-left">
      <svg class="brand-mark" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M8 1.5L14 13.5H11.2L8 6.8L4.8 13.5H2L8 1.5Z" fill="currentColor" />
      </svg>
      <span>Aquila Buddy</span>
    </div>
    <div class="status-right">
      <span class="dot off" id="status-dot"></span>
      <span id="status-label">로그인되지 않음</span>
      <button id="login-btn" class="btn-primary">로그인</button>
      <button id="logout-btn" class="btn-secondary hidden">로그아웃</button>
    </div>
  </div>

  <div id="rec-section">
    <div class="section-header">
      <span class="section-title">추천 이슈</span>
      <span class="section-hint" id="rec-hint"></span>
    </div>
    <p id="rec-loading" class="hidden">불러오는 중...</p>
    <div id="rec-list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
