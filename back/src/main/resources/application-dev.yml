spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquila_buddy}
    username: ${DB_USER:aquila}
    password: ${DB_PASSWORD:aquila}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  github:
    token: ${GITHUB_TOKEN:}
  ai:
    glm-api-key: ${GLM_API_KEY:}
    gemini-api-key: ${GEMINI_API_KEY:}
