spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aquila_buddy}
    username: ${DB_USER:aquila}
    password: ${DB_PASSWORD:aquila}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  github:
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    token: ${GITHUB_TOKEN:}
    issue-search:
      enabled: ${GITHUB_ISSUE_SEARCH_ENABLED:false}
      query: ${GITHUB_ISSUE_SEARCH_QUERY:label:"good first issue"}
      limit: ${GITHUB_ISSUE_SEARCH_LIMIT:3}
  ai:
    provider: ${AI_PROVIDER:fixture}
    openai-compatible:
      api-base-url: ${AI_API_BASE_URL:https://api.openai.com/v1}
      api-key: ${AI_API_KEY:${OPENAI_API_KEY:${GLM_API_KEY:}}}
      chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
      temperature: ${AI_TEMPERATURE:0.2}
      embedding-model: ${AI_EMBEDDING_MODEL:text-embedding-3-small}
      embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
  recommendation:
    similarity:
      provider: ${RECOMMENDATION_SIMILARITY_PROVIDER:score}
      limit: ${RECOMMENDATION_SIMILARITY_LIMIT:20}
