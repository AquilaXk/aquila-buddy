spring:
  application:
    name: aquila-buddy
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  github:
    api-base-url: https://api.github.com
    token: ${GITHUB_TOKEN:}
    issue-search:
      enabled: ${GITHUB_ISSUE_SEARCH_ENABLED:false}
      query: 'label:"good first issue"'
      limit: 3
